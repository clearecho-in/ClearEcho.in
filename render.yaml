services:
  - type: web
    name: clearecho-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20.x"
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        value: contact@clearecho.in
